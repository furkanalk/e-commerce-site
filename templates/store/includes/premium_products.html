<div class="flex flex-wrap bg-gray-200">
{% for product in premium_products %}
  {% if product.premium %}
  <div class="product w-1/4 p-2">
    <div class="p-3 bg-gray-100">
      <a href="{% url 'store:product_detail' product.category.slug product.slug %}">
        <div class="image overflow-hidden">
          {% if product.image %}
          <img src="{{ product.image.url }}" class="hover:scale-110 transition-all duration-500"
            alt="Image of {{ product.title }}">
          {% else %}
          <img src="http://via.placeholder.com/300x300" class="hover:scale-110 transition-all duration-500"
            alt="Image of {{ product.title }}">
          {% endif %}
        </div>
        <div class="flex py-1">
          <i class="fa fa-star {% if product.average_rating < 1 %}text-gray-400{% else %}text-orange-400{% endif %}"></i>
          <i class="fa fa-star {% if product.average_rating < 2 %}text-gray-400{% else %}text-orange-400{% endif %}"></i>
          <i class="fa fa-star {% if product.average_rating < 3 %}text-gray-400{% else %}text-orange-400{% endif %}"></i>
          <i class="fa fa-star {% if product.average_rating < 4 %}text-gray-400{% else %}text-orange-400{% endif %}"></i>
          <i class="fa fa-star {% if product.average_rating < 5 %}text-gray-400{% else %}text-orange-400{% endif %}"></i>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor"
            class="text-purple-400 ml-4 w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z" />
          </svg>
        </div>
        <h2 class="text-medium h-12 font-medium">{{ product.title }}</h2>
        <p class="text-m text-gray-600">{{ product.get_display_price }}</p>
      </a>
    </div>
  </div>
  {% endif%}
{% endfor %}
</div>
